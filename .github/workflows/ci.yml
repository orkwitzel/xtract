name: CI

# Pull requests only. Nothing here needs to run again on the merge commit:
# main is what CI just approved, and the release workflow re-runs the tests
# itself before it tags anything.
on:
  pull_request:
    # `edited` is here for the title check below — a title fixed after the
    # fact has to be re-checked, and the title is what a squash merge commits.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

# A second push to the same pull request makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -race
          - os: macos-latest
            flags: -race
          # The race detector needs a C toolchain, which the Windows image
          # does not promise; the other two legs cover the racy code anyway.
          - os: windows-latest
            flags: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
        shell: bash
      - run: go test ${{ matrix.flags }} ./...
        shell: bash

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Reports, never rewrites: what CI thinks of the tree should be
      # something you can reproduce and fix yourself in one command.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the branch's own commits, and the tags behind them

      - name: Every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/check-commits.sh "$BASE..$HEAD"

      # A squash merge throws those subjects away and uses the pull request
      # title instead, so the title has to hold up on its own.
      - name: The pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/check-commits.sh -m "$TITLE"

      - name: What merging this would release
        run: |
          version=$(.github/next-version.sh)
          if [ -n "$version" ]; then
            echo "Merging this would release **$version**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing here bumps the version, so merging it releases nothing." >> "$GITHUB_STEP_SUMMARY"
          fi
