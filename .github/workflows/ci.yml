name: CI

# Everything here has to pass before a pull request can be merged, which is
# also what keeps main releasable: the release workflow tags whatever main
# says, so main is not allowed to be broken.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same branch makes the run already in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -race
          - os: macos-latest
            flags: -race
          # The race detector needs a C toolchain, which the Windows image
          # does not promise; the other two legs cover the racy code anyway.
          - os: windows-latest
            flags: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
        shell: bash
      - run: go test ${{ matrix.flags }} ./...
        shell: bash

  format:
    name: format and modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy leaves nothing behind
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run go mod tidy and commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

  build:
    name: build every release target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The release cross-compiles all six of these from one machine, so a
      # target that stops building is a broken release. Better to hear about
      # it on the pull request than at tag time.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "--- $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -o /dev/null .
          done
