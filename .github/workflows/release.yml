name: Release

# Every push to main is a candidate release. What comes out of it is decided
# by the commit messages: see CONTRIBUTING.md, or run .github/next-version.sh.
# A push of nothing but docs, tests and refactors releases nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v1.2.3. Leave empty to take it from the commits."
        required: false
        type: string

permissions:
  contents: write   # to create the tag and the release

# Releases are not worth racing; a queued one picks up whatever it finds.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version comes from the tags and the log

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$REQUESTED
          if [ -z "$version" ]; then
            version=$(.github/next-version.sh)
          fi

          if [ -z "$version" ]; then
            echo "Nothing releasable since the last tag." >> "$GITHUB_STEP_SUMMARY"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$version is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version already exists. Delete the tag, or push a commit that moves the version on."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **$version**." >> "$GITHUB_STEP_SUMMARY"

      # CI runs on this same push, but nothing makes this workflow wait for
      # it, so the gate runs here too. A tag is forever; a spare minute is not.
      - name: Test
        if: steps.version.outputs.version != ''
        run: |
          go vet ./...
          go test -race ./...

      - name: Build every platform
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=xtract
            if [ "$os" = windows ]; then
              binary=xtract.exe
            fi

            # Nothing here needs libc, and one static file is the whole point
            # of shipping a binary. -trimpath keeps the runner's paths out of
            # it; -X is what makes `xtract --version` say something true.
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X github.com/orkwitzel/xtract/cmd.version=$VERSION" \
              -o "$stage/$binary" .

            cp README.md LICENSE "$stage/"
            name="xtract_${VERSION#v}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" "$binary" README.md LICENSE)
            else
              tar -czf "dist/$name.tar.gz" -C "$stage" "$binary" README.md LICENSE
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)
          ls -lh dist

      # A wrong -X path is silent: the build succeeds and every binary claims
      # to be "dev". Ask one of them what it is.
      - name: Check the binary knows its version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -xzf "dist/xtract_${VERSION#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" xtract
          reported=$("$RUNNER_TEMP/xtract" --version)
          echo "$reported"
          case $reported in
            *"$VERSION") ;;
            *) echo "::error::binary reports '$reported', expected $VERSION"; exit 1 ;;
          esac

      - name: Tag and publish
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

          # gh creates the tag at --target, so the tag and the release cannot
          # disagree about what was built.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            dist/*

          {
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
